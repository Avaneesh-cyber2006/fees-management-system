<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pillay Sir's ICSE Classes</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Neural Glass Theme CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/css/templatemo-neural-style.css' %}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-4">
                <div class="glass-container text-center">
                    <!-- Logo/Brand -->
                    <div class="mb-4">
                        <img src="{% static 'core/images/logo.png' %}" alt="Pillay Sir's ICSE Classes" height="80" class="mb-3">
                        <h2 class="text-neon">Pillay Sir's ICSE Classes</h2>
                        <p class="text-muted">Fees Management System</p>
                    </div>

                    <!-- Login Form -->
                    <form method="post" id="loginForm">
                        {% csrf_token %}
                        
                        <!-- Messages -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-neural alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <div class="form-group mb-3">
                            <label class="form-label text-start w-100">Username</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--neon-blue);">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" class="form-control form-control-neural" 
                                       name="username" required placeholder="Enter your username">
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <label class="form-label text-start w-100">Password</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--neon-blue);">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control form-control-neural" 
                                       name="password" required placeholder="Enter your password">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-neural btn-lg w-100 mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </form>

                    <!-- Additional Info -->
                    <div class="mt-4 pt-3" style="border-top: 1px solid var(--glass-border);">
                        <small class="text-muted">
                            <i class="fas fa-info-circle me-1"></i>
                            Contact administrator for login credentials
                        </small>
                    </div>
                </div>

                <!-- Demo Credentials (Remove in production) -->
                <div class="glass-container mt-3">
                    <h6 class="text-neon mb-2">Demo Credentials</h6>
                    <small class="text-muted">
                        <strong>Username:</strong> admin<br>
                        <strong>Password:</strong> admin123
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Neural Glass Theme JS -->
    <script src="{% static 'core/js/templatemo-neural-scripts.js' %}"></script>

    <script>
    // Form validation and submission
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const username = this.querySelector('[name="username"]').value.trim();
        const password = this.querySelector('[name="password"]').value.trim();
        
        if (!username || !password) {
            e.preventDefault();
            NeuralTheme.showErrorNotification('Please enter both username and password.');
            return;
        }
        
        // Show loading
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Logging in...';
        submitBtn.disabled = true;
        
        // Re-enable button after 3 seconds in case of error
        setTimeout(() => {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }, 3000);
    });
    </script>
</body>
</html>
