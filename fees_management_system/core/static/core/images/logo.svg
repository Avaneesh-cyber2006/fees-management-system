<svg width="120" height="60" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="30" cy="30" r="25" fill="url(#logoGradient)" opacity="0.2" filter="url(#glow)"/>
  
  <!-- Graduation Cap -->
  <g transform="translate(15, 15)">
    <!-- Cap Base -->
    <ellipse cx="15" cy="20" rx="12" ry="4" fill="url(#logoGradient)"/>
    <!-- Cap Top -->
    <rect x="8" y="16" width="14" height="8" rx="2" fill="url(#logoGradient)"/>
    <!-- Tassel -->
    <line x1="22" y1="16" x2="26" y2="12" stroke="url(#logoGradient)" stroke-width="2"/>
    <circle cx="26" cy="12" r="2" fill="url(#logoGradient)"/>
  </g>
  
  <!-- Text -->
  <text x="65" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#logoGradient)">
    Pillay Sir's
  </text>
  <text x="65" y="40" font-family="Arial, sans-serif" font-size="12" fill="url(#logoGradient)">
    ICSE Classes
  </text>
</svg>
